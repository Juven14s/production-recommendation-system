name: Promote model image

on:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: Successful Retrain workflow run ID
        required: true
        type: string
      version:
        description: Model bundle version produced by that run
        required: true
        type: string
      environment:
        description: Protected GitHub Environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]
  push:
    tags:
      - "promote-staging-*"
      - "promote-production-*"

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || startsWith(github.ref_name, 'promote-production-') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve release coordinates
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.training_run_id }}
          MANUAL_VERSION: ${{ inputs.version }}
          MANUAL_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            run_id="$MANUAL_RUN_ID"
            version="$MANUAL_VERSION"
            target_environment="$MANUAL_ENVIRONMENT"
          else
            version="$GITHUB_REF_NAME"
            if [[ "$version" == promote-production-* ]]; then
              version="${version#promote-production-}"
              target_environment="production"
            else
              version="${version#promote-staging-}"
              target_environment="staging"
            fi
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=model-bundle-$version&per_page=10" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id')"
          fi
          [[ -n "$run_id" && "$run_id" != "null" ]]
          [[ -n "$version" ]]
          echo "training_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target_environment=$target_environment" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.release.outputs.training_run_id }}
          name: model-bundle-${{ steps.release.outputs.version }}
          path: release_bundle
      - name: Validate approved bundle
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          mle-validate-bundle release_bundle
          actual="$(python -c 'import json; print(json.load(open("release_bundle/manifest.json"))["version"])')"
          [[ "$actual" == "$EXPECTED_VERSION" ]]
          python -m mle_recsys.mlops.release_context release_bundle release_registry.json
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test and publish
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARGET_ENVIRONMENT: ${{ steps.release.outputs.target_environment }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --file Dockerfile.release --tag "$image:model-$VERSION" .
          docker run --detach --rm --name recommender-smoke --publish 18000:8000 "$image:model-$VERSION"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then break; fi
            if [[ "$attempt" == 30 ]]; then docker logs recommender-smoke; exit 1; fi
            sleep 2
          done
          docker stop recommender-smoke
          docker tag "$image:model-$VERSION" "$image:$TARGET_ENVIRONMENT"
          docker push "$image:model-$VERSION"
          docker push "$image:$TARGET_ENVIRONMENT"
