name: Retrain

on:
  workflow_dispatch:
  push:
    tags: ["retrain-*"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: recommender-retraining
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Restore previous champion metrics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous_run="$(gh run list --workflow retrain.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$previous_run" ]]; then
            mkdir -p previous-governance artifacts/model_registry
            gh run download "$previous_run" --name "governance-$previous_run" --dir previous-governance
            if [[ -f previous-governance/registry.json ]]; then
              cp previous-governance/registry.json artifacts/model_registry/registry.json
            fi
          fi
      - name: Download and verify MovieLens 1M
        shell: bash
        run: |
          curl --fail --location --retry 3 --output ml-1m.zip https://files.grouplens.org/datasets/movielens/ml-1m.zip
          curl --fail --location --retry 3 --output ml-1m.zip.md5 https://files.grouplens.org/datasets/movielens/ml-1m.zip.md5
          md5sum --check ml-1m.zip.md5
          unzip -q ml-1m.zip -d data/raw
      - name: Ingest and split
        run: |
          mle-ingest --input-dir data/raw/ml-1m --output-dir data/processed/ml-1m
          mle-split --ratings data/processed/ml-1m/ratings.parquet --output-dir data/processed/ml-1m/splits
      - name: Train, evaluate and register candidate
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          mle-retrain \
            --split-dir data/processed/ml-1m/splits \
            --movies data/processed/ml-1m/movies.parquet \
            --registry-root artifacts/model_registry \
            --tracking-uri sqlite:///artifacts/mlflow/mlflow.db
      - name: Resolve and validate champion
        id: champion
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("artifacts/model_registry/registry.json"))["champion"])')"
          if [[ -z "$version" || "$version" == "None" ]]; then
            echo "No candidate passed the promotion gates" >&2
            exit 1
          fi
          mle-validate-bundle "artifacts/model_registry/bundles/$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: model-bundle-${{ steps.champion.outputs.version }}
          path: artifacts/model_registry/bundles/${{ steps.champion.outputs.version }}/
          if-no-files-found: error
          retention-days: 90
      - name: Prepare governance artifact
        shell: bash
        run: cp artifacts/model_registry/registry.json registry.json
      - uses: actions/upload-artifact@v7
        with:
          name: governance-${{ github.run_id }}
          path: registry.json
          if-no-files-found: error
          retention-days: 90
