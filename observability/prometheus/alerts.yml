groups:
  - name: recommendation-api
    rules:
      - alert: RecommendationAPIHighErrorRate
        expr: |
          sum(rate(recsys_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(recsys_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Recommendation API error rate exceeds 5%

      - alert: RecommendationAPIHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(recsys_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Recommendation API p95 latency exceeds 200 ms
