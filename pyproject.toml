[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mle-recsys"
version = "0.1.0"
description = "Production-oriented two-stage movie recommendation system."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faiss-cpu>=1.9,<2.0",
    "fastapi>=0.115,<1.0",
    "lightgbm>=4.5,<5.0",
    "mlflow>=3.18,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=18,<20",
    "prometheus-client>=0.21,<1.0",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.14,<2.0",
    "torch>=2.6,<3.0",
    "redis>=5.2,<8.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "hatchling>=1.27,<2.0",
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
mle-ingest = "mle_recsys.data.ingest:main"
mle-bpr = "mle_recsys.models.bpr:main"
mle-faiss = "mle_recsys.retrieval.faiss_index:main"
mle-item-knn = "mle_recsys.models.item_knn:main"
mle-ranker = "mle_recsys.ranking.lightgbm_ranker:main"
mle-registry = "mle_recsys.mlops.cli:main"
mle-retrain = "mle_recsys.mlops.retrain:main"
mle-validate-bundle = "mle_recsys.mlops.validate_bundle:main"
mle-serve = "mle_recsys.api.app:run"
mle-split = "mle_recsys.data.split:main"
mle-popularity = "mle_recsys.models.popularity:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mle_recsys"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=mle_recsys --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
